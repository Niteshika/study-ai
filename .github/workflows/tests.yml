# Runs the tests on GitHub's servers every time you push or open a pull request.
# Results show up in the repo's "Actions" tab (green tick = all tests passed).
#
# It starts a throwaway Postgres + pgvector database just for the tests,
# so it never touches your real RDS database. No AWS or API keys are needed:
# tests use LLM_PROVIDER=fake (set in tests/conftest.py).

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17      # Postgres with pgvector already installed
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: studyai_test
        ports:
          - 5432:5432
        # Wait until the database is ready before running the tests.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/studyai_test

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python (same version as the Dockerfile)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker:
    # Checks the Dockerfile still builds, so a broken image is caught here
    # instead of on the EC2 server.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t study-ai:ci .
